<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>學生成績記錄</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft YaHei', sans-serif;
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== Main App ===== */

  /* ===== Header ===== */
  .header {
    background: linear-gradient(135deg, #1f6feb 0%, #388bfd 100%);
    padding: 16px; display: flex; justify-content: space-between; align-items: center;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-icon { font-size: 24px; }
  .header-title { font-size: 18px; font-weight: 700; }
  .header-version {
    background: rgba(255,255,255,0.2); color: white;
    padding: 6px 12px; border-radius: 8px; font-size: 12px; white-space: nowrap;
  }

  /* ===== Tabs (fixed bottom nav, flush) ===== */
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    display: flex; gap: 0;
    background: #11161d; border-top: 1px solid #21262d;
    padding: 6px 4px;
  }
  .tab-btn {
    flex: 1; padding: 10px 6px; border: none; background: transparent;
    color: #8b949e; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    letter-spacing: 0.3px; border-radius: 10px;
  }
  .tab-btn:hover:not(.active) { color: #c9d1d9; background: #161b22; }
  .tab-btn.active {
    background: linear-gradient(135deg, #38bdf8 0%, #2dd4bf 100%);
    color: #04121a;
    box-shadow: 0 4px 14px rgba(56,189,248,0.35), inset 0 1px 0 rgba(255,255,255,0.25);
  }
  @media (max-width: 600px) {
    .tab-btn { font-size: 13px; gap: 4px; padding: 9px 4px; }
  }
  .main-app { padding-bottom: 76px; }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  /* ===== Gallery ===== */
  .gallery-grid {
    padding: 16px; display: grid; grid-template-columns: 1fr; gap: 12px;
  }
  .gallery-card {
    background: #161b22; border: 1px solid #30363d; border-radius: 16px;
    padding: 18px;
  }
  .gallery-head { display: flex; align-items: center; gap: 14px; }
  .gallery-avatar {
    width: 72px; height: 72px; border-radius: 50%; object-fit: cover;
    border: 3px solid #30363d; flex-shrink: 0;
  }
  .gallery-name { font-size: 18px; font-weight: 700; }
  .gallery-nick { font-size: 12px; color: #8b949e; margin-top: 2px; }
  .score-chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
  @media (max-width: 600px) { .score-chips { grid-template-columns: 1fr 1fr; } }
  .score-chip {
    background: #0d1117; border-radius: 10px; padding: 10px;
  }
  .chip-subject { font-size: 11px; color: #8b949e; }
  .chip-score { font-size: 18px; font-weight: 700; margin: 2px 0; }
  .chip-score.high { color: #3fb950; }
  .chip-score.medium { color: #d29922; }
  .chip-score.low { color: #f85149; }
  .chip-score.none { color: #8b949e; font-size: 14px; }
  .chip-date { font-size: 10px; color: #484f58; }
  .gallery-mistakes { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .mistake-title { font-size: 12px; color: #8b949e; font-weight: 600; }
  .mistake-item { background: #0d1117; border-radius: 10px; padding: 10px 12px; }
  .mistake-subject { font-size: 11px; color: #8b949e; margin-bottom: 4px; }
  .mistake-text { font-size: 12px; color: #c9d1d9; line-height: 1.6; }

  /* ===== Charts Section ===== */
  .charts-container {
    padding: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .chart-card { cursor: pointer; }
  .chart-card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 12px;
    text-align: center;
  }
  .chart-title {
    font-size: 12px;
    color: #8b949e;
    margin-bottom: 8px;
    font-weight: 600;
  }
  .chart-canvas {
    width: 100%;
    height: 140px;
  }
  .chart-legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    margin-top: 8px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    color: #8b949e;
  }
  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  /* ===== Filter Bar ===== */
  .filter-bar {
    padding: 0 16px 12px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid #30363d;
    background: #161b22;
    color: #8b949e;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn.active {
    background: #1f6feb;
    border-color: #1f6feb;
    color: white;
  }

  /* ===== Section Title ===== */
  .section-title {
    font-size: 14px;
    font-weight: 600;
    color: #8b949e;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::before {
    content: '';
    width: 3px;
    height: 14px;
    background: #388bfd;
    border-radius: 2px;
  }

  /* ===== Record List ===== */
  .record-list {
    padding: 0 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .record-card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .record-card:active { transform: scale(0.98); }
  .record-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }
  .record-student { font-size: 15px; font-weight: 600; }
  .record-score { font-size: 20px; font-weight: 700; }
  .record-score.high { color: #3fb950; }
  .record-score.medium { color: #d29922; }
  .record-score.low { color: #f85149; }
  .record-score.none { color: #8b949e; font-size: 14px; }
  .record-meta {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .record-tag {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 6px;
    background: #21262d;
    color: #8b949e;
  }
  .record-tag.subject-中文 { background: #3d1f1f; color: #ff7b72; }
  .record-tag.subject-英文 { background: #1f2d3d; color: #79c0ff; }
  .record-tag.subject-數學 { background: #1f3d1f; color: #7ee787; }
  .record-tag.subject-中文常識 { background: #3d3d1f; color: #e3b341; }
  .record-tag.subject-英文常識 { background: #3d1f3d; color: #d2a8ff; }
  .record-tag.type-測驗卷 { background: #1f2d3d; color: #79c0ff; }
  .record-tag.type-考試卷 { background: #3d2f1f; color: #ffa657; }
  .record-tag.type-練習 { background: #1f3d3d; color: #7ee787; }
  .record-focus {
    font-size: 12px;
    color: #8b949e;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ===== Pagination ===== */
  .pager {
    display: flex; justify-content: center; align-items: center; gap: 10px;
    padding: 4px 16px 20px;
  }
  .page-btn {
    padding: 8px 14px; border-radius: 10px; border: 1px solid #30363d;
    background: #161b22; color: #c9d1d9; font-size: 13px; cursor: pointer;
  }
  .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .page-info { font-size: 12px; color: #8b949e; }

  /* ===== Stats Toolbar / Reset ===== */
  .stats-toolbar { padding: 16px 16px 0; display: flex; justify-content: flex-end; }
  .reset-btn {
    padding: 8px 14px; border-radius: 10px; border: 1px solid #30363d;
    background: #161b22; color: #c9d1d9; font-size: 13px; cursor: pointer;
  }
  .reset-btn:hover { background: #21262d; }

  /* ===== Clickable gallery cards ===== */
  .score-chip.clickable, .mistake-item.clickable { cursor: pointer; transition: border-color 0.15s, background 0.15s; }
  .score-chip.clickable:hover, .mistake-item.clickable:hover { background: #161b22; border: 1px solid #38bdf8; }

  /* ===== Detail Modal ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.visible { display: flex; }
  .modal {
    background: #161b22;
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 600px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 20px;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .modal-title { font-size: 18px; font-weight: 700; }
  .modal-close {
    background: #21262d; border: none; color: #8b949e;
    width: 32px; height: 32px; border-radius: 50%; font-size: 16px; cursor: pointer;
  }
  .modal-score {
    font-size: 36px;
    font-weight: 700;
    text-align: center;
    margin: 16px 0;
  }
  .modal-section { margin-bottom: 16px; }
  .modal-section-title {
    font-size: 13px;
    font-weight: 600;
    color: #58a6ff;
    margin-bottom: 6px;
  }
  .modal-section-content {
    font-size: 13px;
    color: #c9d1d9;
    line-height: 1.6;
    background: #0d1117;
    padding: 10px 12px;
    border-radius: 8px;
    white-space: pre-wrap;
  }
  .modal-links { display: flex; gap: 10px; flex-wrap: wrap; }
  .modal-link {
    display: inline-block;
    padding: 8px 14px;
    background: #1f6feb;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-size: 13px;
  }

  /* ===== Footer ===== */
  .footer {
    text-align: center;
    padding: 20px;
    color: #484f58;
    font-size: 11px;
    border-top: 1px solid #21262d;
  }
</style>
</head>
<body>

<!-- ===== Main App ===== -->
<div class="main-app" id="mainApp">
  <div class="header">
    <div class="header-left">
      <img src="logo.png" alt="HIS Tools" style="width:34px;height:34px;border-radius:8px;object-fit:contain;flex-shrink:0">
      <span class="header-title">學生成績記錄</span>
    </div>
    <span class="header-version" id="siteVersion">版本載入中…</span>
  </div>

  <!-- Tab Nav -->
  <nav class="tabs" id="tabNav">
    <button class="tab-btn active" data-tab="gallery">👧 學生圖庫</button>
    <button class="tab-btn" data-tab="records">📋 成績記錄</button>
    <button class="tab-btn" data-tab="stats">📊 統計圖表</button>
  </nav>

  <!-- Tab 1: Gallery -->
  <section class="tab-pane active" id="pane-gallery">
    <div class="gallery-grid" id="galleryGrid"></div>
  </section>

  <!-- Tab 2: Records -->
  <section class="tab-pane" id="pane-records">
    <div class="filter-bar" id="studentFilter">
      <button class="filter-btn active" data-student="all">全部</button>
      <button class="filter-btn" data-student="Cici">Cici</button>
      <button class="filter-btn" data-student="Coco">Coco</button>
    </div>
    <div class="filter-bar" id="subjectFilter">
      <button class="filter-btn active" data-subject="all">全部科目</button>
      <button class="filter-btn" data-subject="中文">中文</button>
      <button class="filter-btn" data-subject="英文">英文</button>
      <button class="filter-btn" data-subject="數學">數學</button>
      <button class="filter-btn" data-subject="中文常識">中文常識</button>
      <button class="filter-btn" data-subject="英文常識">英文常識</button>
    </div>
    <div class="filter-bar" id="gradeFilter">
      <button class="filter-btn active" data-grade="all">全年級</button>
      <button class="filter-btn" data-grade="小一">小一</button>
      <button class="filter-btn" data-grade="小二">小二</button>
      <button class="filter-btn" data-grade="小三">小三</button>
      <button class="filter-btn" data-grade="小四">小四</button>
    </div>
    <div class="filter-bar" id="typeFilter">
      <button class="filter-btn active" data-type="all">全部類型</button>
      <button class="filter-btn" data-type="測驗卷">測驗卷</button>
      <button class="filter-btn" data-type="考試卷">考試卷</button>
      <button class="filter-btn" data-type="練習">練習</button>
    </div>
    <div class="section-title">成績記錄</div>
    <div class="record-list" id="recordList"></div>
    <div class="pager" id="pager"></div>
  </section>

  <!-- Tab 3: Statistics -->
  <section class="tab-pane" id="pane-stats">
    <div class="stats-toolbar">
      <button class="reset-btn" id="resetFiltersBtn">🔄 重置篩選</button>
    </div>
    <div class="charts-container">
      <div class="chart-card" title="點擊科目切片可跳去記錄">
        <div class="chart-title">科目分佈</div>
        <canvas class="chart-canvas" id="pieChart"></canvas>
        <div class="chart-legend" id="pieLegend"></div>
      </div>
      <div class="chart-card" title="點擊長條可跳去記錄">
        <div class="chart-title">年級平均分</div>
        <canvas class="chart-canvas" id="barChart"></canvas>
        <div class="chart-legend" id="barLegend"></div>
      </div>
    </div>
  </section>

  <div class="footer">
    HIS Tools · 學生成績記錄系統
  </div>
</div>

<!-- ===== Detail Modal ===== -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">詳情</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modalContent"></div>
  </div>
</div>

<script>
let allRecords = [];
let currentTab = "gallery";
let currentStudent = "all";
let currentSubject = "all";
let currentGrade = "all";
let currentType = "all";
let currentPage = 1;
const PAGE_SIZE = 10;

const STUDENT_PROFILE = {
  'Cici': { img: 'images/cici.png', nick: '姐姐' },
  'Coco': { img: 'images/coco.png', nick: '妹妹' }
};

const SCORE_GROUPS = [
  { key: '中文', subjects: ['中文'] },
  { key: '英文', subjects: ['英文'] },
  { key: '數學', subjects: ['數學'] },
  { key: '常識', subjects: ['中文常識', '英文常識'] }
];

const SUBJECT_COLORS = {
  '中文': '#ff7b72',
  '英文': '#79c0ff',
  '數學': '#7ee787',
  '中文常識': '#e3b341',
  '英文常識': '#d2a8ff'
};

const GRADE_ORDER = ['小一', '小二', '小三', '小四', '小五', '小六'];
const GRADE_COLORS = {
  '小一': '#79c0ff',
  '小二': '#a5d6ff',
  '小三': '#7ee787',
  '小四': '#e3b341',
  '小五': '#ffa657',
  '小六': '#ff7b72'
};

let pieGeo = { cx: 0, cy: 0, radius: 0, slices: [] };
let barGeo = { bars: [] };

// ===== Load Data =====
async function loadData() {
  try {
    const res = await fetch(`student-records.json?v=${Date.now()}`);
    const data = await res.json();
    allRecords = data.records;
    const ver = data.version || '—';
    const upd = data.updated ? ` · ${data.updated}` : '';
    document.getElementById('siteVersion').textContent = `版本 ${ver}${upd}`;
    renderAll();
  } catch (err) {
    document.getElementById('recordList').innerHTML = '<p style="color:#8b949e;text-align:center;padding:20px;">載入失敗</p>';
  }
}

function renderAll() {
  renderGallery();
  renderRecords();
  if (currentTab === 'stats') { drawPieChart(); drawBarChart(); }
}

// ===== Tabs =====
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + tab));
  if (tab === 'stats') { drawPieChart(); drawBarChart(); }
  if (tab === 'records') { renderRecords(); }
}

function resetFilters() {
  currentStudent = 'all';
  currentSubject = 'all';
  currentGrade = 'all';
  currentType = 'all';
  currentPage = 1;
  syncFilterButtons();
  renderAll();
}

function jumpToRecord(student, idx) {
  const rec = allRecords[idx];
  if (!rec) return;
  currentStudent = student;
  currentSubject = rec.subject;
  currentGrade = 'all';
  currentType = 'all';
  currentPage = 1;
  syncFilterButtons();
  renderAll();
  switchTab('records');
}

function syncFilterButtons() {
  const sync = (barId, attr, val) => {
    document.querySelectorAll('#' + barId + ' .filter-btn').forEach(b =>
      b.classList.toggle('active', b.dataset[attr] === val));
  };
  sync('studentFilter', 'student', currentStudent);
  sync('subjectFilter', 'subject', currentSubject);
  sync('gradeFilter', 'grade', currentGrade);
  sync('typeFilter', 'type', currentType);
}

// ===== Gallery =====
function latestForGroup(student, group) {
  const recs = allRecords
    .filter(r => r.student === student && group.subjects.includes(r.subject))
    .sort((a, b) => new Date(b.date) - new Date(a.date));
  return recs[0] || null;
}

function scoreClassOf(score) {
  if (score === null || score === undefined) return 'none';
  if (score >= 85) return 'high';
  if (score >= 70) return 'medium';
  return 'low';
}

function renderGallery() {
  const grid = document.getElementById('galleryGrid');
  const students = [...new Set(allRecords.map(r => r.student))];
  if (students.length === 0) {
    grid.innerHTML = '<p style="color:#8b949e;text-align:center;padding:20px;">暫無學生資料</p>';
    return;
  }
  grid.innerHTML = students.map(s => {
    const profile = STUDENT_PROFILE[s] || {};
    const groups = SCORE_GROUPS.map(g => ({ g, rec: latestForGroup(s, g) }));
    const chips = groups.map(({ g, rec }) => {
      let cls = 'none', text = '無記錄', date = '';
      if (rec) {
        cls = scoreClassOf(rec.score);
        text = rec.score === null || rec.score === undefined ? '未評分' : rec.score + '%';
        date = rec.date || '';
      }
      const idx = rec ? allRecords.indexOf(rec) : -1;
      const cls2 = rec ? 'clickable' : '';
      const handler = rec ? `onclick="jumpToRecord('${s}', ${idx})"` : '';
      return `
        <div class="score-chip ${cls2}" ${handler}>
          <div class="chip-subject">${g.key}</div>
          <div class="chip-score ${cls}">${text}</div>
          <div class="chip-date">${date || '—'}</div>
        </div>`;
    }).join('');
    const mistakes = groups.map(({ g, rec }) => {
      const text = rec && rec.mistakes ? rec.mistakes : '暫無錯誤重點';
      const idx = rec ? allRecords.indexOf(rec) : -1;
      const cls2 = rec ? 'clickable' : '';
      const handler = rec ? `onclick="jumpToRecord('${s}', ${idx})"` : '';
      return `
        <div class="mistake-item ${cls2}" ${handler}>
          <div class="mistake-subject">${g.key}</div>
          <div class="mistake-text">${text}</div>
        </div>`;
    }).join('');
    return `
      <div class="gallery-card">
        <div class="gallery-head">
          <img class="gallery-avatar" src="${profile.img || ''}" alt="${s}" onerror="this.style.visibility='hidden'">
          <div>
            <div class="gallery-name">${s}</div>
            ${profile.nick ? `<div class="gallery-nick">${profile.nick}</div>` : ''}
          </div>
        </div>
        <div class="score-chips">${chips}</div>
        <div class="gallery-mistakes">
          <div class="mistake-title">❌ 各科最新錯誤重點</div>
          ${mistakes}
        </div>
      </div>`;
  }).join('');
}

// ===== Filter =====
function getFilteredRecords() {
  return allRecords.filter(r => {
    if (currentStudent !== 'all' && r.student !== currentStudent) return false;
    if (currentSubject !== 'all' && r.subject !== currentSubject) return false;
    if (currentGrade !== 'all' && r.grade !== currentGrade) return false;
    if (currentType !== 'all' && r.paper_type !== currentType) return false;
    return true;
  }).sort((a, b) => new Date(b.date) - new Date(a.date));
}

// ===== Records =====
function renderRecords() {
  const records = getFilteredRecords();
  const list = document.getElementById('recordList');
  const pager = document.getElementById('pager');
  if (records.length === 0) {
    list.innerHTML = '<p style="color:#8b949e;text-align:center;padding:20px;">沒有符合條件的記錄</p>';
    if (pager) pager.innerHTML = '';
    return;
  }
  const totalPages = Math.max(1, Math.ceil(records.length / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageItems = records.slice(start, start + PAGE_SIZE);
  list.innerHTML = pageItems.map((r, i) => {
    const globalIndex = start + i;
    let scoreClass = 'none', scoreText = '未評分';
    if (r.score !== null) {
      if (r.score >= 85) scoreClass = 'high';
      else if (r.score >= 70) scoreClass = 'medium';
      else scoreClass = 'low';
      scoreText = r.score + '%';
    }
    return `
      <div class="record-card" onclick="showDetail(${globalIndex})">
        <div class="record-header">
          <div class="record-student">${r.student} · ${r.subject}</div>
          <div class="record-score ${scoreClass}">${scoreText}</div>
        </div>
        <div class="record-meta">
          <span class="record-tag">${r.date || '未設定日期'}</span>
          <span class="record-tag">${r.grade || ''}</span>
          ${r.paper_type ? `<span class="record-tag type-${r.paper_type}">${r.paper_type}</span>` : ''}
          <span class="record-tag">${r.source || ''}</span>
        </div>
        <div class="record-focus">${r.review_points || r.focus_points || '暫無學習重點'}</div>
      </div>`;
  }).join('');
  pager.innerHTML = `
    <button class="page-btn" id="prevPage" ${currentPage === 1 ? 'disabled' : ''}>‹ 上一頁</button>
    <span class="page-info">第 ${currentPage} / ${totalPages} 頁 · 共 ${records.length} 條</span>
    <button class="page-btn" id="nextPage" ${currentPage === totalPages ? 'disabled' : ''}>下一頁 ›</button>`;
  document.getElementById('prevPage').onclick = () => { if (currentPage > 1) { currentPage--; renderRecords(); } };
  document.getElementById('nextPage').onclick = () => { if (currentPage < totalPages) { currentPage++; renderRecords(); } };
}

// ===== Pie Chart: Subject Distribution =====
function drawPieChart() {
  const canvas = document.getElementById('pieChart');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  
  const records = getFilteredRecords();
  const subjectCounts = {};
  records.forEach(r => {
    if (r.subject) subjectCounts[r.subject] = (subjectCounts[r.subject] || 0) + 1;
  });
  
  const total = Object.values(subjectCounts).reduce((a, b) => a + b, 0);
  const cx = rect.width / 2;
  const cy = rect.height / 2;
  const radius = Math.min(cx, cy) - 10;
  pieGeo = { cx, cy, radius, slices: [] };

  ctx.clearRect(0, 0, rect.width, rect.height);

  if (total === 0) {
    ctx.fillStyle = '#484f58';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('無數據', cx, cy);
    document.getElementById('pieLegend').innerHTML = '';
    return;
  }

  let startAngle = -Math.PI / 2;
  const entries = Object.entries(subjectCounts);

  entries.forEach(([subject, count]) => {
    const sliceAngle = (count / total) * Math.PI * 2;
    const endAngle = startAngle + sliceAngle;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radius, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle = SUBJECT_COLORS[subject] || '#8b949e';
    ctx.fill();
    pieGeo.slices.push({ subject, start: startAngle, end: endAngle });
    startAngle = endAngle;
  });
  
  // Center hole for donut effect
  ctx.beginPath();
  ctx.arc(cx, cy, radius * 0.5, 0, Math.PI * 2);
  ctx.fillStyle = '#161b22';
  ctx.fill();
  
  // Center text
  ctx.fillStyle = '#e6edf3';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(total, cx, cy - 4);
  ctx.fillStyle = '#8b949e';
  ctx.font = '9px sans-serif';
  ctx.fillText('總記錄', cx, cy + 10);
  
  // Legend
  document.getElementById('pieLegend').innerHTML = entries.map(([subject, count]) => 
    `<div class="legend-item"><div class="legend-dot" style="background:${SUBJECT_COLORS[subject] || '#8b949e'}"></div>${subject} ${count}</div>`
  ).join('');
}

// ===== Bar Chart: Grade Average =====
function drawBarChart() {
  const canvas = document.getElementById('barChart');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  
  const records = getFilteredRecords().filter(r => r.score !== null);
  const gradeScores = {};
  records.forEach(r => {
    if (!gradeScores[r.grade]) gradeScores[r.grade] = [];
    gradeScores[r.grade].push(r.score);
  });
  
  const gradeAvgs = {};
  Object.entries(gradeScores).forEach(([grade, scores]) => {
    gradeAvgs[grade] = scores.reduce((a, b) => a + b, 0) / scores.length;
  });

  barGeo = { bars: [] };
  ctx.clearRect(0, 0, rect.width, rect.height);
  
  const entries = Object.entries(gradeAvgs).sort((a, b) => {
    const idxA = GRADE_ORDER.indexOf(a[0]);
    const idxB = GRADE_ORDER.indexOf(b[0]);
    return (idxA === -1 ? 99 : idxA) - (idxB === -1 ? 99 : idxB);
  });
  if (entries.length === 0) {
    ctx.fillStyle = '#484f58';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('無數據', rect.width / 2, rect.height / 2);
    document.getElementById('barLegend').innerHTML = '';
    return;
  }
  
  const padding = { top: 15, right: 10, bottom: 25, left: 30 };
  const chartWidth = rect.width - padding.left - padding.right;
  const chartHeight = rect.height - padding.top - padding.bottom;
  const barWidth = Math.min(30, chartWidth / entries.length * 0.6);
  const gap = chartWidth / entries.length;
  
  // Y axis grid lines (0, 50, 100)
  ctx.strokeStyle = '#21262d';
  ctx.lineWidth = 1;
  [0, 50, 100].forEach(val => {
    const y = padding.top + chartHeight - (val / 100) * chartHeight;
    ctx.beginPath();
    ctx.moveTo(padding.left, y);
    ctx.lineTo(rect.width - padding.right, y);
    ctx.stroke();
    ctx.fillStyle = '#484f58';
    ctx.font = '9px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(val, padding.left - 4, y + 3);
  });
  
  // Bars
  entries.forEach(([grade, avg], i) => {
    const x = padding.left + gap * i + (gap - barWidth) / 2;
    const barHeight = (avg / 100) * chartHeight;
    const y = padding.top + chartHeight - barHeight;
    barGeo.bars.push({ grade, x, width: barWidth });

    ctx.fillStyle = GRADE_COLORS[grade] || '#8b949e';
    ctx.beginPath();
    ctx.roundRect(x, y, barWidth, barHeight, [4, 4, 0, 0]);
    ctx.fill();
    
    // Value on top
    ctx.fillStyle = '#e6edf3';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(avg.toFixed(0) + '%', x + barWidth / 2, y - 4);
    
    // Grade label
    ctx.fillStyle = '#8b949e';
    ctx.font = '10px sans-serif';
    ctx.fillText(grade, x + barWidth / 2, rect.height - padding.bottom + 14);
  });
  
  // Legend
  document.getElementById('barLegend').innerHTML = entries.map(([grade, avg]) => 
    `<div class="legend-item"><div class="legend-dot" style="background:${GRADE_COLORS[grade] || '#8b949e'}"></div>${grade} ${avg.toFixed(1)}%</div>`
  ).join('');
}

function friendlyLabel(text, fallback) {
  return text && !/^https?:\/\//.test(text) ? text : fallback;
}

// ===== Detail =====
function showDetail(index) {
  const records = getFilteredRecords();
  const r = records[index];
  let scoreClass = 'none', scoreText = '未評分';
  if (r.score !== null) {
    if (r.score >= 85) scoreClass = 'high';
    else if (r.score >= 70) scoreClass = 'medium';
    else scoreClass = 'low';
    scoreText = r.score + '%';
  }
  const materials = r.materials || [];
  const hasLinks = r.paper_url || r.graded_url || materials.length > 0;
  document.getElementById('modalTitle').textContent = `${r.student} - ${r.subject}`;
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-score ${scoreClass}">${scoreText}</div>
    <div class="modal-section">
      <div class="modal-section-title">基本資料</div>
      <div class="modal-section-content">日期：${r.date || '未設定'}<br>年級：${r.grade || '未設定'}<br>類型：${r.paper_type || '未設定'}<br>出處：${r.source || '未設定'}${r.record_id ? `<br>記錄ID：${r.record_id}` : ''}</div>
    </div>
    ${r.review_points ? `<div class="modal-section"><div class="modal-section-title">📖 針對的學習重點</div><div class="modal-section-content">${r.review_points}</div></div>` : ''}
    ${r.mistakes ? `<div class="modal-section"><div class="modal-section-title">❌ 學生錯誤重點</div><div class="modal-section-content">${r.mistakes}</div></div>` : ''}
    ${r.focus_points ? `<div class="modal-section"><div class="modal-section-title">📝 需複習學習重點</div><div class="modal-section-content">${r.focus_points}</div></div>` : ''}
    <div class="modal-section">
      <div class="modal-section-title">📎 相關文件</div>
      <div class="modal-links">
        ${r.paper_url ? `<a href="${r.paper_url}" target="_blank" class="modal-link">📄 ${friendlyLabel(r.paper_text, '試卷')}</a>` : ''}
        ${r.graded_url ? `<a href="${r.graded_url}" target="_blank" class="modal-link">✏️ ${friendlyLabel(r.graded_text, '批改卷')}</a>` : ''}
        ${materials.map(m => `<a href="${m.url}" target="_blank" class="modal-link">📘 ${m.title || '相關教材'}</a>`).join('')}
        ${!hasLinks ? '<span style="color:#8b949e;font-size:13px;">暫無文件</span>' : ''}
      </div>
    </div>`;
  document.getElementById('modalOverlay').classList.add('visible');
}
function closeModal(event) {
  if (!event || event.target.id === 'modalOverlay') {
    document.getElementById('modalOverlay').classList.remove('visible');
  }
}

// ===== Filters =====
function bindFilter(barId, attr, setter) {
  document.getElementById(barId).addEventListener('click', e => {
    if (e.target.classList.contains('filter-btn')) {
      e.target.parentElement.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      setter(e.target.dataset[attr]);
      currentPage = 1;
      renderAll();
    }
  });
}
bindFilter('studentFilter', 'student', v => currentStudent = v);
bindFilter('subjectFilter', 'subject', v => currentSubject = v);
bindFilter('gradeFilter', 'grade', v => currentGrade = v);
bindFilter('typeFilter', 'type', v => currentType = v);

// ===== Tab Nav =====
document.getElementById('tabNav').addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn');
  if (btn) switchTab(btn.dataset.tab);
});

// ===== Chart Click → jump to Records with filter =====
function normAngle(a) {
  const twoPi = Math.PI * 2;
  return ((a % twoPi) + twoPi) % twoPi;
}

document.getElementById('pieChart').addEventListener('click', e => {
  const rect = e.target.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const dx = x - pieGeo.cx, dy = y - pieGeo.cy;
  const dist = Math.hypot(dx, dy);
  if (dist > pieGeo.radius || dist < pieGeo.radius * 0.5) return;
  const ang = normAngle(Math.atan2(dy, dx));
  const slice = pieGeo.slices.find(s => {
    const a1 = normAngle(s.start), a2 = normAngle(s.end);
    return a1 <= a2 ? ang >= a1 && ang < a2 : ang >= a1 || ang < a2;
  });
  if (!slice) return;
  currentSubject = slice.subject;
  currentGrade = 'all';
  currentType = 'all';
  currentPage = 1;
  syncFilterButtons();
  renderAll();
  switchTab('records');
});

document.getElementById('barChart').addEventListener('click', e => {
  const rect = e.target.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const bar = barGeo.bars.find(b => x >= b.x && x <= b.x + b.width);
  if (!bar) return;
  currentGrade = bar.grade;
  currentSubject = 'all';
  currentType = 'all';
  currentPage = 1;
  syncFilterButtons();
  renderAll();
  renderRecords();
  switchTab('records');
});

document.getElementById('resetFiltersBtn').addEventListener('click', () => {
  resetFilters();
});

loadData();
</script>
